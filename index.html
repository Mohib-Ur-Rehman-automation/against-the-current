<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Against the Current</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{--ol:#3a2a4a;--ui:"Fredoka","Baloo 2","Trebuchet MS",system-ui,sans-serif;--ttl:"Lilita One","Fredoka","Trebuchet MS",system-ui,sans-serif;--sun:#ffd75a;--red:#ff5a4d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#4f7f9c;font-family:var(--ui);color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#c{z-index:1}
button{font-family:var(--ttl);cursor:pointer}
.btn{font-size:clamp(18px,3.4vmin,28px);letter-spacing:.03em;color:var(--ol);background:linear-gradient(180deg,#ffe58a 0%,#ffd75a 35%,#f5a623 100%);border:4px solid var(--ol);border-radius:18px;padding:.5em 1.3em .55em;box-shadow:0 5px 0 #b86b12,0 8px 0 var(--ol),inset 0 3px 0 rgba(255,255,255,.6);transition:transform .06s}
.btn:active{transform:translateY(4px)}
.btn.alt{background:linear-gradient(180deg,#fff 0%,#fff6e5 60%,#f0dfc0 100%);box-shadow:0 5px 0 #c9b48a,0 8px 0 var(--ol),inset 0 3px 0 rgba(255,255,255,.8)}
.btn.big{font-size:clamp(28px,6.5vmin,48px);border-radius:26px;padding:.35em 1.5em .4em}
.btn.sm{font-size:clamp(14px,2.4vmin,18px);padding:.4em 1em .45em;border-radius:14px}
#pause{position:fixed;top:12px;right:12px;z-index:4;width:52px;height:52px;border-radius:16px;border:4px solid var(--ol);background:linear-gradient(180deg,#fff,#fff6e5 60%,#f0dfc0);box-shadow:0 5px 0 var(--ol),inset 0 3px 0 rgba(255,255,255,.8);font-size:20px;color:var(--ol);display:none}
#duck{position:fixed;right:max(18px,3vw);bottom:max(22px,4vh);z-index:4;width:clamp(84px,19vmin,120px);height:clamp(84px,19vmin,120px);border-radius:50%;border:5px solid var(--ol);background:radial-gradient(circle at 35% 28%,#a8ecf7 0%,#6fd3e6 30%,#2a8fb3 100%);color:#fff;font-size:clamp(18px,3.8vmin,26px);box-shadow:0 6px 0 #1d6280,0 9px 0 var(--ol),inset 0 4px 0 rgba(255,255,255,.5);display:none;text-shadow:0 2px 0 #1d6280;line-height:1}
#duck:active,#duck.on{transform:translateY(5px)}
#duck small{display:block;font-family:var(--ui);font-size:.5em;font-weight:600;opacity:.95;margin-top:.2em}
body.play #pause,body.play #duck{display:block}
.screen{position:fixed;inset:0;z-index:5;display:none;place-items:center;padding:20px;text-align:center}
.screen.on{display:grid}
.dim{background:rgba(30,26,52,.6)}
.card{background:#fff6e5;color:var(--ol);border:5px solid var(--ol);border-radius:28px;box-shadow:0 10px 0 var(--ol);padding:clamp(18px,4vmin,34px);max-width:min(92vw,480px);width:100%;display:grid;gap:16px;justify-items:center}
.card h2{font-family:var(--ttl);font-weight:400;font-size:clamp(30px,7vmin,48px);line-height:1}
.card p{font-weight:500;font-size:clamp(15px,2.6vmin,19px);line-height:1.35}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.sl{display:grid;grid-template-columns:5.2em 1fr;gap:10px;align-items:center;width:100%;font-weight:600}
.sl input{width:100%;height:28px;accent-color:#2a8fb3}
#title{align-content:space-between;justify-items:center;padding:clamp(18px,5vh,56px) 20px clamp(26px,7vh,70px);background:linear-gradient(180deg,rgba(30,58,88,.5) 0%,rgba(30,58,88,0) 38%,rgba(30,58,88,0) 70%,rgba(30,58,88,.55) 100%)}
.logo{font-family:var(--ttl);font-weight:400;line-height:.9;font-size:clamp(50px,14vmin,128px);color:var(--sun);-webkit-text-stroke:clamp(6px,1.4vmin,12px) var(--ol);paint-order:stroke fill;text-shadow:0 clamp(5px,1.1vmin,10px) 0 var(--ol);transform:rotate(-4deg)}
.logo small{display:block;font-size:.4em;color:#ffe58a;letter-spacing:.06em;margin-bottom:.16em}
.logo b{font-weight:400;background:linear-gradient(180deg,#fff3b0 0%,#ffd75a 45%,#f5a623 100%);-webkit-background-clip:text;background-clip:text;color:var(--sun)}
.tip{font-weight:600;font-size:clamp(14px,2.5vmin,19px);background:rgba(30,42,70,.62);border-radius:14px;padding:.5em .9em;margin-top:16px;display:inline-block}
.stats{display:flex;gap:14px;font-family:var(--ttl);font-size:clamp(22px,5vmin,34px)}
.stats div{background:#fff;border:3px solid var(--ol);border-radius:16px;padding:.25em .6em;box-shadow:0 4px 0 var(--ol)}
.stats span{display:block;font-family:var(--ui);font-size:.4em;font-weight:600;opacity:.7}
#end{background:linear-gradient(180deg,rgba(255,217,138,.22),rgba(255,159,107,.12));align-items:start;padding-top:clamp(16px,6vh,60px)}
#wipe{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;background:#fff}
#nogl{position:fixed;inset:0;z-index:9;display:none;place-items:center;padding:24px;text-align:center;background:#2c3352;font-weight:600}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="c" aria-label="Against the Current. Drag to wade."></canvas>
<div id="wipe"></div>
<button id="pause" type="button" aria-label="Pause">II</button>
<button id="duck" type="button">DUCK<small>space</small></button>

<section id="title" class="screen on">
  <h1 class="logo"><small>AGAINST THE</small><b>CURRENT</b></h1>
  <div><button class="btn big" id="bPlay" type="button">PLAY</button><br>
  <span class="tip" id="tip">Drag anywhere to wade &middot; DUCK goes under</span></div>
</section>
<section id="paused" class="screen dim"><div class="card">
  <h2>Paused</h2>
  <label class="sl">Music<input id="vMusic" type="range" min="0" max="100" value="60"></label>
  <label class="sl">Sounds<input id="vSfx" type="range" min="0" max="100" value="80"></label>
  <button class="btn alt sm" id="bGfx" type="button">Graphics: High</button>
  <div class="row"><button class="btn" id="bResume" type="button">Resume</button><button class="btn alt" id="bRestart" type="button">Restart stretch</button><button class="btn alt" id="bQuit" type="button">Title</button></div>
</div></section>
<section id="dead" class="screen dim"><div class="card">
  <h2>Swept away!</h2><p id="deadWhy"></p>
  <div class="row"><button class="btn" id="bRetry" type="button">Try this stretch again</button></div>
</div></section>
<section id="end" class="screen"><div class="card">
  <h2>The Special Place</h2><p>Dry ground. He tips the water out of his boots.</p>
  <div class="stats"><div><b id="eTime">0:00</b><span>time</span></div><div><b id="eBoats">0</b><span>paper boats</span></div><div><b id="eDeaths">0</b><span>times swept away</span></div></div>
  <div class="row"><button class="btn" id="bAgain" type="button">Play again</button></div>
</div></section>
<div id="nogl">This game needs WebGL, and it couldn't start in this browser.</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
/*LOGIC-START*/
// Game rules only: no drawing, no sound. Runs in the browser and headless in Node.
const HW=4.5,TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,hyp=Math.hypot;
function mkrng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// Ten stretches. cur = current in units/second (x across the street, y: negative is forward).
const STRETCH=[
 {name:'Home Lane',     curName:'still water',    cur:[0,0],    L:74,par:50,g:7, pal:0},
 {name:'School Road',   curName:'with you',       cur:[0,-.9],  L:96,par:46,g:7, hole:6,frog:4,pal:1,pow:['umb']},
 {name:'The Bazaar',    curName:'still water',    cur:[0,0],    L:100,par:60,g:9, hole:3,mud:5,hidden:2,talk:5,frog:2,pal:2,pow:['tube']},
 {name:'Main Road',     curName:'sideways',       cur:[1.15,0], L:108,par:72,g:5, hole:4,veh:.5,pal:3,pow:['chai']},
 {name:'The Underpass', curName:'against you',    cur:[0,.55],  L:76,par:80,boss:1,pal:4},
 {name:'Crow Street',   curName:'against you',    cur:[0,.95],  L:96,par:70,g:8, hole:5,frog:3,crow:2,pal:5,pow:['umb','chai']},
 {name:'Mud Market',    curName:'sideways',       cur:[-1.1,0], L:104,par:72,g:8, hole:4,mud:9,hidden:6,talk:5,frog:5,pal:2,pow:['tube']},
 {name:'Ring Road',     curName:'fast, and it turns',seq:[[0,-1.5],[1.3,-.6],[0,-1.5],[-1.3,-.6]],per:6,L:130,par:58,g:5,hole:6,veh:.75,crow:1,talk:2,pal:3,pow:['umb','chai']},
 {name:'The Spillway',  curName:'against you',    cur:[0,.8],   L:88,par:95,boss:2,pal:4},
 {name:'Last Mile',     curName:'it keeps changing',seq:[[0,1.1],[1.25,0],[0,-1],[-1.25,0]],per:5,L:126,par:78,g:9,hole:7,mud:5,hidden:3,talk:3,frog:4,crow:2,veh:.4,pal:6,pow:['tube','umb','chai']}
];
const ST={car:{w:1.7,d:2.7,h:.4,climb:1},cart:{w:1.5,d:1.1,h:.3,climb:1},shelter:{w:2.5,d:1.3,h:.95,climb:1},
          wall:{w:2.6,d:.55,h:.7},post:{w:.4,d:.4,h:2.1,post:1},uncle:{w:1.1,d:.9,h:1,uncle:1}};
function ev(G,a,b,c){G.ev.push([a,b,c])}
function hint(G,k){if(!G.seen[k]){G.seen[k]=1;ev(G,'hint',k)}}
function newGame(){return {mode:'title',S:null,P:null,ev:[],seen:{},boats:0,time:0,gauge:0,damT:0,deaths:0,dodged:0}}
function newPlayer(){return {x:0,y:-.6,vx:0,vy:0,r:.34,hearts:3,inv:0,duck:0,duckCd:0,up:null,pushT:0,exitT:0,slow:0,frogT:0,caught:null,mash:0,
  tube:0,umb:0,swept:0,hitT:0,happy:0,dist:0,fx:0,fy:-1,climbT:0,mud:false}}
function gen(i){
  const c=STRETCH[i],R=mkrng(4242+i*131),L=c.L,D=1.6;
  const S={i,c,L,statics:[],holes:[],mud:[],garb:[],boats:[],pows:[],frogs:[],talkers:[],crows:[],veh:[],blds:[],
    wave:null,waveN:0,waveGap:4.5,next:c.boss?(c.boss===1?'surge':'tall'):null,t:0,cur:(c.seq?c.seq[0]:c.cur).slice(),curI:0,curT:0,vehT:2.5};
  for(const sd of[-1,1]){let y=9;while(y>-L-15){const d=3.2+R()*3;S.blds.push({sd,y:y-d/2,d,h:1.5+R()*2.3,col:Math.floor(R()*7),sign:R()<.65,aw:R()<.5,win:1+Math.floor(R()*3)});y-=d+(R()<.18?1.4:.12)}}
  S.blds.sort((a,b)=>a.y-b.y);
  const clear=(x,y,rad)=>{for(const s of S.statics)if(Math.abs(x-s.x)<s.w/2+rad&&Math.abs(y-s.y)<s.d/2+rad)return false;
    for(const h of S.holes)if(hyp(x-h.x,y-h.y)<h.r+rad)return false;return true};
  const put=(n,fn,xa,xb,rad)=>{for(let k=0;k<n;k++)for(let t=0;t<30;t++){const x=(R()<.5?-1:1)*(xa+R()*(xb-xa)),y=-5-R()*(L-11);if(clear(x,y,rad)){fn(x,y);break}}};
  const add=(t,x,y)=>S.statics.push(Object.assign({t,x,y,col:Math.floor(R()*5)},ST[t]));
  if(c.boss){ // wave arenas: rows of things to climb, grab and hide behind
    // clusters: something to climb, something to grab, something to hide behind. The second arena leaves one out each time.
    const gap=c.boss===1?8.5:10.5;let k=0;
    for(let y=-5;y>-L+6;y-=gap,k++){
      const lanes=[-3,0,3];for(let j=2;j>0;j--){const q=Math.floor(R()*(j+1));[lanes[j],lanes[q]]=[lanes[q],lanes[j]]}
      const set=[[['car','cart','shelter'][Math.floor(R()*3)],0],['post',-.3],[R()<.4?'uncle':'wall',1.7]];
      if(c.boss===2)set.splice(k%3,1);
      set.forEach((q,j)=>add(q[0],lanes[j]+(R()-.5)*.5,y+q[1]+(R()-.5)*.6))}
  }else{
    for(let y=-4;y>-L+4;y-=8+R()*3)add('post',(R()<.5?-1:1)*4.3,y);
    put(Math.round(L/14),(x,y)=>add('car',x,y),2.95,3.3,.6);
    put(Math.round(L/20),(x,y)=>add('cart',x,y),2.7,3.4,.6);
    if(!c.veh&&i>=2)put(Math.round(L/28),(x,y)=>add('wall',x,y),1.2,2.6,.7);
  }
  put(D*(c.mud||0),(x,y)=>S.mud.push({x,y,rx:1.5+R()*1.2,ry:1.1+R()*.9,ph:R()*6}),0,3,1.2);
  let hid=0;for(const m of S.mud)if(hid<D*(c.hidden||0)&&clear(m.x,m.y,.9)){S.holes.push({x:m.x+(R()-.5)*.8,y:m.y+(R()-.5)*.5,r:.55,hid:1});hid++}
  put(D*(c.hole||0),(x,y)=>S.holes.push({x,y,r:.55,hid:0}),0,3.7,1);
  put(D*(c.g||0),(x,y)=>S.garb.push({x,y,k:Math.floor(R()*4),ph:R()*6}),0,3.9,.5);
  put(Math.round(L/6),(x,y)=>S.boats.push({x,y,ph:R()*6}),0,3.8,.5);
  put(D*(c.frog||0),(x,y)=>S.frogs.push({x,y,dir:R()<.5?-1:1,t:R()*1.5,hop:0,z:0,fx:x,tx:x,fy:y,ty:y,gone:0}),0,3.5,.5);
  put(D*(c.talk||0),(x,y)=>S.talkers.push({x,y,state:'idle',t:0,talkT:0,k:Math.floor(R()*2),ph:R()*6}),3,3.7,.6);
  for(let k=0;k<(c.crow||0);k++)S.crows.push({state:'away',t:2+k*2.5+R()*2,x:0,y:0,z:3,tx:0,ty:0,sx:0,sy:0,a:R()*6});
  (c.pow||[]).forEach(t=>put(1,(x,y)=>S.pows.push({t,x,y}),0,3.5,.6));
  return S;
}
function startStretch(G,i,retry){
  const keep=G.P&&!retry?Math.min(3,G.P.hearts+1):3;
  G.S=gen(i);G.P=newPlayer();G.P.hearts=keep;G.gauge=0;G.mode='play';ev(G,'stretch',i);
  const c=G.S.c;if(i===0)hint(G,'move');if(c.boss)hint(G,'boss');
  if(!c.seq){if(c.cur[1]>0)hint(G,'against');else if(c.cur[0])hint(G,'side')}else hint(G,'turns');
}
function hurt(G,kind,force){
  const P=G.P;if(P.inv>0&&!force)return;
  P.hearts--;P.inv=2.2;P.hitT=.7;P.duck=0;if(P.caught){P.caught.state='done';P.caught=null}
  ev(G,'hurt',kind);if(P.hearts<=0){G.mode='dead';G.deaths++;ev(G,'dead',kind)}
}
function nearPost(G,rad){const P=G.P;for(const o of G.S.statics)if(o.post&&hyp(P.x-o.x,P.y-o.y)<rad)return o;return null}
// "hiding behind" = standing just downstream of something solid, in its shadow
function inLee(G){const P=G.P;for(const o of G.S.statics)if(!o.post&&Math.abs(P.x-o.x)<=o.w/2+.12&&P.y-o.y>0&&P.y-o.y<o.d/2+1.35)return o;return null}
function shelterState(G){const P=G.P;return {up:!!P.up,grab:!P.up&&!!nearPost(G,.85),lee:!P.up&&!!inLee(G)}}
function waveOK(type,s){return type==='surge'?(s.up||s.grab||s.lee):type==='tall'?s.up:type==='ripper'?s.grab:s.lee}
function movePlayer(G,dt,inp){
  const P=G.P,S=G.S;let mx=inp.mx,my=inp.my;const m0=hyp(mx,my);if(m0>1){mx/=m0;my/=m0}const m=Math.min(1,m0);
  if(P.frogT>0){const w=Math.sin(S.t*7)*.75,c=Math.cos(w),s=Math.sin(w);[mx,my]=[mx*c-my*s,mx*s+my*c]}
  if(m>.15){P.fx=mx;P.fy=my}
  P.mud=false;for(const q of S.mud)if(((P.x-q.x)/q.rx)**2+((P.y-q.y)/q.ry)**2<1){P.mud=true;break}
  const sp=(3.1+.12*S.i)*(P.slow>0?.5:1)*(P.duck>0?.6:1)*(P.tube>0?1.55:1)*(P.mud?.72:1);
  if(P.up){ // on a roof: walk around on it, push past an edge to hop down
    const o=P.up,nx=P.x+mx*sp*.8*dt,ny=P.y+my*sp*.8*dt,ex=o.w/2-.15,ey=o.d/2-.15;
    P.climbT=Math.max(0,P.climbT-dt);
    const out=Math.abs(nx-o.x)>ex||Math.abs(ny-o.y)>ey;
    P.x=clamp(nx,o.x-ex,o.x+ex);P.y=clamp(ny,o.y-ey,o.y+ey);
    if(out&&m>.5){P.exitT+=dt;if(P.exitT>.22){
      const dx=(nx-o.x)/(o.w/2),dy=(ny-o.y)/(o.d/2);
      if(Math.abs(dx)>Math.abs(dy))P.x=o.x+Math.sign(dx)*(o.w/2+P.r+.05);else P.y=o.y+Math.sign(dy)*(o.d/2+P.r+.05);
      P.up=null;P.exitT=0;P.pushT=0;ev(G,'hop')}}else P.exitT=0;
    P.vx=P.vy=0;P.dist+=m*sp*.8*dt;P.x=clamp(P.x,-HW+P.r,HW-P.r);return;
  }
  const k=1-Math.exp(-9*dt);P.vx=lerp(P.vx,mx*sp,k);P.vy=lerp(P.vy,my*sp,k);
  const cf=P.tube>0?.25:1;
  P.x+=(P.vx+S.cur[0]*cf)*dt;P.y+=(P.vy+S.cur[1]*cf)*dt;P.dist+=hyp(P.vx,P.vy)*dt;
  let pushing=null;
  for(const o of S.statics){
    if(Math.abs(P.y-o.y)>3)continue;
    const cx=clamp(P.x,o.x-o.w/2,o.x+o.w/2),cy=clamp(P.y,o.y-o.d/2,o.y+o.d/2),dx=P.x-cx,dy=P.y-cy,d=hyp(dx,dy);
    if(d>=P.r)continue;
    if(d<1e-4){const ox=o.w/2+P.r-Math.abs(P.x-o.x),oy=o.d/2+P.r-Math.abs(P.y-o.y);
      if(ox<oy)P.x+=(P.x<o.x?-1:1)*ox;else P.y+=(P.y<o.y?-1:1)*oy}
    else{P.x=cx+dx/d*P.r;P.y=cy+dy/d*P.r}
    if(o.climb&&P.duck<=0){const tx=o.x-P.x,ty=o.y-P.y,tl=hyp(tx,ty)||1;if((mx*tx+my*ty)/tl>.35)pushing=o}
  }
  if(pushing&&m>.4){P.pushT+=dt;if(P.pushT>.26){const o=pushing;P.up=o;P.x=clamp(P.x,o.x-o.w/2+.2,o.x+o.w/2-.2);P.y=clamp(P.y,o.y-o.d/2+.2,o.y+o.d/2-.2);
      P.climbT=.3;P.pushT=0;P.exitT=0;P.vx=P.vy=0;ev(G,'climb')}}
  else P.pushT=Math.max(0,P.pushT-dt*2);
  P.x=clamp(P.x,-HW+P.r,HW-P.r);P.y=clamp(P.y,-S.L,.8);
}
const TIMERS=['inv','slow','frogT','tube','umb','duckCd','hitT','happy'];
function step(G,dt,inp){
  if(G.mode==='dam'){G.damT+=dt;if(G.damT>=2.6){if(G.S.i>=STRETCH.length-1){G.mode='end';ev(G,'end')}else startStretch(G,G.S.i+1,false)}return}
  if(G.mode!=='play')return;
  const P=G.P,S=G.S,c=S.c;S.t+=dt;G.time+=dt;
  for(const k of TIMERS)if(P[k]>0)P[k]=Math.max(0,P[k]-dt);
  if(c.seq){S.curT+=dt;if(S.curT>=c.per){S.curT=0;S.curI=(S.curI+1)%c.seq.length;ev(G,'cur')}

  ctx.save();ctx.translate(x,y);ctx.rotate(Math.atan2(vy,vx));ctx.beginPath();ctx.moveTo(r*.62,0);ctx.lineTo(-r*.1,-r*.45);ctx.lineTo(-r*.1,-r*.16);ctx.lineTo(-r*.6,-r*.16);ctx.lineTo(-r*.6,r*.16);ctx.lineTo(-r*.1,r*.16);ctx.lineTo(-r*.1,r*.45);ctx.closePath();ctx.fillStyle='#2a8fb3';ctx.fill();ctx.stroke();ctx.restore()}
function bubble(x,y,msg){const px=Math.max(12,u*.3);ctx.font='600 '+px+'px '+FONT;const w=ctx.measureText(msg).width+px*1.3,h=px*2;x=clamp(x,w/2+6,W-w/2-6);
  ink();ctx.beginPath();ctx.moveTo(x-px*.3,y+h/2-2);ctx.lineTo(x,y+h/2+px*.6);ctx.lineTo(x+px*.4,y+h/2-2);ctx.closePath();fs('#fff');rr(x-w/2,y-h/2,w,h,h*.42);fs('#fff');
  ctx.fillStyle='#fff';ctx.fillRect(x-px*.24,y+h/2-lw,px*.56,lw*1.6);ctx.fillStyle=OL;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(msg,x,y+1)}
function labels(){
  const S=G.S,P=G.P;
  for(const t of S.talkers){if(Math.abs(t.y-P.y)>16)continue;let msg=null;
    if(t.state==='chase')msg=['Oye! Beta!','One minute!','Arey, wait!'][Math.floor((t.ph||0)*3)%3];
    else if(t.state==='talk')msg=['...and THEN your aunt said...','You have grown so much!','In MY day, the floods...','Have you eaten? You look thin.','Did I tell you about my knee?','Your cousin got a job, you know.'][Math.floor(t.talkT/2.2)%6];
    else if(t.state==='done')msg='Okay okay, go.';else if(t.state==='tired')msg='Kids these days...';
    if(msg){const q=proj(t.x,waterY+2.1,t.y);bubble(q[0],q[1]-u*.3,msg)}}
  for(const c of S.crows)if(c.state==='lock'){const q=proj(c.x,waterY+c.z+1,c.y);txt('CAW!',q[0],q[1],u*.42,'#ff5a4d')}
  if(G.mode!=='dam'&&P.caught){const q=proj(P.x,waterY-.2,P.y+.9),x=q[0],y=q[1],bw=u*2.4;ink();rr(x-bw/2,y,bw,u*.34,u*.17);fs('#fff');if(P.mash>.3){rr(x-bw/2,y,Math.max(u*.34,bw*clamp(P.mash/9,0,1)),u*.34,u*.17);fs('#ffc928')}
    const left=Math.max(0,78-P.caught.talkT);txt('TAP TAP TAP!  '+Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0'),x,y-u*.42,u*.36,'#fff')}
  if(G.mode==='dam'&&G.damT>=1&&G.damT<1.7){const q=proj(kid.position.x,3.6,kid.position.z);txt('WHEEE!',q[0],q[1],u*.55,'#ffd75a')}
  for(let i=pops.length-1;i>=0;i--){const p=pops[i];p.t+=1/60;if(p.t>1){pops.splice(i,1);continue}ctx.globalAlpha=1-p.t*p.t;const q=proj(p.x,waterY+1.5+p.t*1.1,p.y);txt(p.s,q[0],q[1],u*.44,p.c);ctx.globalAlpha=1}
}
function hud(){
  const S=G.S,P=G.P,m=Math.max(10,u*.3),hs=clamp(u*.62,22,40);
  for(let i=0;i<3;i++)heart(m+hs*.6+i*hs*1.15,m+hs*.6,hs,i<P.hearts);
  ink();const by=m+hs*1.8;rr(m,by-hs*.42,hs*2.5,hs*.84,hs*.42);fs('#fff6e5');
  ctx.save();ctx.translate(m+hs*.6,by+hs*.08);const s=hs*.32;ctx.beginPath();ctx.moveTo(-s,-s*.2);ctx.lineTo(s,-s*.2);ctx.lineTo(s*.55,s*.35);ctx.lineTo(-s*.55,s*.35);ctx.closePath();fs('#fff');ctx.beginPath();ctx.moveTo(0,-s*1.1);ctx.lineTo(s*.5,-s*.2);ctx.lineTo(-s*.5,-s*.2);ctx.closePath();fs('#fff7c2');ctx.restore();
  ctx.fillStyle=OL;ctx.font=hs*.56+'px '+TFONT;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(String(G.boats),m+hs*1.2,by+1);
  let px=m+hs*.6,py=by+hs*1.05;for(const [k,v,mx,c] of [['tube',P.tube,6,'#ff8a3c'],['umb',P.umb,12,'#ff5a4d']])if(v>0){ink();circ(px,py,hs*.38);fs('#fff6e5');ctx.beginPath();ctx.moveTo(px,py);ctx.arc(px,py,hs*.38,-Math.PI/2,-Math.PI/2+TAU*v/mx);ctx.closePath();fs(c);px+=hs*.95}
  // stretch ribbon, rising water tube, current dial
  const pw=Math.min(W-2*(m+hs*3.8)-64,u*7.2),cx=W/2,ph=hs*.86;
  if(pw>120){ink();ctx.beginPath();ctx.moveTo(cx-pw/2,m);ctx.lineTo(cx+pw/2,m);ctx.lineTo(cx+pw/2-ph*.36,m+ph/2);ctx.lineTo(cx+pw/2,m+ph);ctx.lineTo(cx-pw/2,m+ph);ctx.lineTo(cx-pw/2+ph*.36,m+ph/2);ctx.closePath();fs(vgrad(m,m+ph,'#5fcfe4','#2a8fb3'));
    ctx.font=ph*.56+'px '+TFONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#1d6280';ctx.fillText((S.i+1)+'/10  '+S.c.name,cx,m+ph/2+3);ctx.fillStyle='#fff';ctx.fillText((S.i+1)+'/10  '+S.c.name,cx,m+ph/2+1)}
  const gy=pw>120?m+ph+7:m,gw=pw>120?pw*.84:Math.min(W*.4,160),gx=cx-gw/2,gh=Math.max(13,hs*.4),f=clamp(G.gauge,0,1),hot=f>.72&&Math.floor(now*6)%2;
  ink();rr(gx,gy,gw,gh,gh/2);fs('rgba(240,248,252,.9)');if(f>.02){ctx.save();rr(gx,gy,gw,gh,gh/2);ctx.clip();ctx.fillStyle=hot?vgrad(gy,gy+gh,'#ff8a7a','#e03a30'):vgrad(gy,gy+gh,'#8fdcf0','#2a8fb3');
    ctx.beginPath();const fw=Math.max(gh,gw*f);ctx.moveTo(gx,gy);ctx.lineTo(gx+fw,gy);for(let k=0;k<=4;k++)ctx.lineTo(gx+fw+Math.sin(now*5+k*1.6)*gh*.12,gy+gh*k/4);ctx.lineTo(gx,gy+gh);ctx.closePath();ctx.fill();ctx.restore();ink();rr(gx,gy,gw,gh,gh/2);ctx.stroke()}
  ctx.fillStyle='rgba(255,255,255,.6)';rr(gx+gh*.4,gy+lw*.9,gw-gh*.8,gh*.16,gh*.08);ctx.fill();
  ctx.fillStyle=hot?'#fff':OL;ctx.font='700 '+gh*.7+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('WATER RISING',cx,gy+gh/2+1);
  arrow(W-m-hs*.62,m+hs*.62+62,hs*.62,S.cur[0],S.cur[1]);txt('current',W-m-hs*.62,m+hs*1.52+62,hs*.3,'#fff','center',FONT);
  // waves: forecast, warning
  if(S.c.boss){const w=S.wave,ty=gy+gh+hs*.95;
    if(w&&w.phase==='warn'){const k=WAVE[w.type],q=1-w.t/w.warn,bw=Math.min(W*.86,u*9);ink();rr(cx-bw/2,ty-hs*.6,bw,hs*1.72,hs*.4);fs(Math.floor(now*8)%2?vgrad(ty-hs*.6,ty+hs,'#ff7a5c','#d93a30'):vgrad(ty-hs*.6,ty+hs,'#ffe58a','#f5a623'));
      txt(k.n+'!',cx,ty-hs*.06,hs*.74,'#fff');txt(k.tip,cx,ty+hs*.52,hs*.36,'#fff','center',FONT);ink();rr(cx-bw*.44,ty+hs*.82,bw*.88,hs*.16,hs*.08);ctx.fillStyle='rgba(0,0,0,.25)';ctx.fill();rr(cx-bw*.44,ty+hs*.82,bw*.88*q,hs*.16,hs*.08);ctx.fillStyle='#fff';ctx.fill()}
    else if(!w||w.done){const k=WAVE[S.next];txt('next wave: '+k.n+'  ('+k.tip+')',cx,ty,hs*.4,'#fff','center',FONT)}}
  if(P.frogT>0){ctx.globalAlpha=.94;ink();ell(W/2,H*.5,Math.min(W,H)*.42,Math.min(W,H)*.34);fs('#6bd35a');ell(W/2,H*.56,Math.min(W,H)*.28,Math.min(W,H)*.2);ctx.fillStyle='#d8f5a8';ctx.fill();ctx.globalAlpha=1;txt('FROG!  duck to wash it off',W/2,H*.5,Math.max(18,u*.5),'#fff')}
  if(banner&&banner.t<2.8){const a=banner.t<.3?banner.t/.3:banner.t>2.3?(2.8-banner.t)/.5:1,sl=banner.t<.3?(1-banner.t/.3)*-W*.3:0;ctx.globalAlpha=a;const y=H*.3,nm=STRETCH[banner.i].name.toUpperCase(),px=Math.min(W*.105,u*1.05);
    ctx.font=px+'px '+TFONT;const rw=Math.min(W*.96,ctx.measureText(nm).width+px*2.2),rh=px*1.6;ctx.save();ctx.translate(sl,0);ink();
    ctx.beginPath();ctx.moveTo(W/2-rw/2,y-rh/2);ctx.lineTo(W/2+rw/2,y-rh/2);ctx.lineTo(W/2+rw/2-rh*.3,y);ctx.lineTo(W/2+rw/2,y+rh/2);ctx.lineTo(W/2-rw/2,y+rh/2);ctx.lineTo(W/2-rw/2+rh*.3,y);ctx.closePath();fs(vgrad(y-rh/2,y+rh/2,'#ffe58a','#f5a623'));
    txt('STRETCH '+(banner.i+1)+' OF 10',W/2,y-rh*.5-u*.5,Math.max(14,u*.38),'#ffe58a','center',FONT);txt(nm,W/2,y+2,px,'#fff');txt('current: '+STRETCH[banner.i].curName,W/2,y+rh*.5+u*.55,Math.max(14,u*.4),'#fff','center',FONT);ctx.restore();
    const n=10,gap=Math.min(u*.7,(W-40)/n);for(let i=0;i<n;i++){ink();circ(W/2+(i-(n-1)/2)*gap,y+rh*.5+u*1.5,gap*(i===banner.i?.32:.2));fs(i<banner.i?'#7fe08a':i===banner.i?'#ffc928':STRETCH[i].boss?'#ff5a4d':'#fff')}ctx.globalAlpha=1}
  if(toast){const px=Math.max(14,Math.min(u*.38,20)),mw=Math.min(W-36,460),lines=wrap(toast.s,mw-px*1.6,px),bh=lines.length*px*1.3+px,ty=Math.max(H*(G.S.c.boss?.3:.17),m+hs*(G.S.c.boss?5.4:3.3));
    ctx.globalAlpha=clamp(toast.t<.25?toast.t/.25:(toast.l-toast.t)/.4,0,1);ink();ctx.fillStyle=OL;rr(W/2-mw/2,ty+4,mw,bh,px*.8);ctx.fill();rr(W/2-mw/2,ty,mw,bh,px*.8);fs('#fff6e5');ctx.fillStyle=OL;ctx.font='600 '+px+'px '+FONT;ctx.textAlign='center';ctx.textBaseline='middle';
    lines.forEach((l,i)=>ctx.fillText(l,W/2,ty+px*.5+px*.65+i*px*1.3));ctx.globalAlpha=1}
  if(joy.on&&joy.moved){ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=4;circ(joy.ox,joy.oy,46);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.75)';const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=Math.max(1,hyp(dx,dy)),k=Math.min(l,46)/l;circ(joy.ox+dx*k,joy.oy+dy*k,20);ctx.fill()}
  if(flash>0){ctx.fillStyle='rgba(255,70,60,'+(flash*.35)+')';ctx.fillRect(0,0,W,H)}
  if(G.mode==='dam'&&G.damT>1.9){const c=MOOD[Math.min(S.i+1,10)].bg;ctx.fillStyle='rgba('+Math.round(c.r*255)+','+Math.round(c.g*255)+','+Math.round(c.b*255)+','+clamp((G.damT-1.9)/.6,0,1)+')';ctx.fillRect(0,0,W,H)}
}

/* ---------- events from the rules ---------- */
function handle(e){
  const k=e[0],P=G.P,py=P.up?(VTOP[P.up.t]||P.up.h):waterY;
  if(k==='hint'){const q={s:HINTS[e[1]]||'',t:0,l:e[1].startsWith('w_')?3.2:4.6};if(e[1].startsWith('w_'))toast=q;else toastQ.push(q)}
  else if(k==='stretch'){banner={i:e[1],t:0};toast=null;toastQ.length=0;setMusic(STRETCH[e[1]].boss?'boss':'play',e[1]);flash=0;parts.length=0}
  else if(k==='hurt'){sfx('hurt');shake=1;flash=1;splash(P.x,P.y,16,py);pops.push({s:{deep:'TOO DEEP!',hole:'MANHOLE!',pit:'HIDDEN PIT!',veh:'HONK!',crow:'PECKED!',wave:'SWEPT!'}[e[1]]||'OUCH',x:P.x,y:P.y,t:0,c:'#ff5a4d'})}
  else if(k==='dead'){sfx('dead');$('#deadWhy').textContent=WHY[e[1]]||'';setTimeout(()=>{if(G.mode==='dead')show('dead')},900)}
  else if(k==='boat'){sfx('boat');pops.push({s:'+1',x:P.x,y:P.y,t:0,c:'#fff'})}
  else if(k==='pow'){sfx('pow')}
  else if(k==='ew'){sfx('ew');pops.push({s:'EW!',x:P.x,y:P.y,t:0,c:'#b8e04a'})}
  else if(k==='safe'){sfx('safe');pops.push({s:'SAFE!',x:P.x,y:P.y,t:0,c:'#7fe08a'})}
  else if(k==='swept'){sfx('swept');const why={up:'wrong shelter: not up high',grab:'wrong shelter: a post won\'t do',lee:'wrong shelter: hiding won\'t do',open:'caught in the open'}[e[2]];toast={s:WAVE[e[1]].n+': '+why+'. Next time, '+WAVE[e[1]].tip+'.',t:0,l:4}}
  else if(k==='free'){sfx('free');pops.push({s:'FREE!',x:P.x,y:P.y,t:0,c:'#ffc928'})}
  else if(k==='end'){sfx('end');setMusic('title');$('#eTime').textContent=Math.floor(G.time/60)+':'+String(Math.floor(G.time%60)).padStart(2,'0');$('#eBoats').textContent=G.boats;$('#eDeaths').textContent=G.deaths;show('end')}
  else if(k==='duck'||k==='climb'||k==='hop'){sfx(k);splash(P.x,P.y,8,waterY)}
  else if(SF[k])sfx(k);
}
function show(id){for(const s of document.querySelectorAll('.screen'))s.classList.toggle('on',s.id===id);document.body.classList.toggle('play',!id)}
function start(i,retry){audio();if(!retry&&i===0){G=newGame()}startStretch(G,i,retry);G.ev.forEach(handle);G.ev.length=0;paused=false;show('')}
function pause(on){if(G.mode!=='play'&&G.mode!=='dam')return;paused=on;show(on?'paused':'')}

/* ---------- graphics quality: steps down by itself on a slow machine ---------- */
const QN=['Low','Medium','High'],noop=()=>{};
function applyQ(){DPR=Math.min(window.devicePixelRatio||1,gfx.q===2?1.5:1);renderer.setPixelRatio(DPR);renderer.setSize(W,H,false);
  const k=gfx.q===2?.55:.4;water.getRenderTarget().setSize(Math.max(64,Math.round(W*DPR*k)),Math.max(64,Math.round(H*DPR*k)));water.onBeforeRender=gfx.q===0?noop:reflRender;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);$('#bGfx').textContent='Graphics: '+QN[gfx.q]}
let ftN=0,ftSum=0;
function watchFps(rdt){if(!gfx.auto||gfx.q===0||paused||document.hidden)return;ftN++;ftSum+=rdt;if(ftN>=150){const avg=ftSum/ftN;ftN=0;ftSum=0;if(avg>1/40){gfx.q--;applyQ();save()}}}

/* ---------- loop ---------- */
let last=0,acc=0;
function frame(t){
  requestAnimationFrame(frame);const rdt=Math.min(.05,(t-last)/1000||0);last=t;now=t/1000;
  let mx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),my=(keys.arrowdown||keys.s?1:0)-(keys.arrowup||keys.w?1:0);
  if(joy.on&&joy.moved){const dx=joy.x-joy.ox,dy=joy.y-joy.oy,l=hyp(dx,dy);if(l>8){const k=Math.min(1,l/46)/l;mx=dx*k;my=dy*k}}
  inp.mx=mx;inp.my=my;
  if(!paused&&(G.mode==='play'||G.mode==='dam')){acc+=rdt;let n=0;while(acc>=1/60&&n<4){step(G,1/60,inp);inp.duck=false;inp.tap=false;acc-=1/60;n++;for(const e of G.ev)handle(e);G.ev.length=0;if(G.mode!=='play'&&G.mode!=='dam')break}
    const S=G.S;flow.x+=(S.cur[0]+.05)*rdt;flow.y+=(S.cur[1]+.25)*rdt;
    if(banner)banner.t+=rdt;if(toast){toast.t+=rdt;if(toast.t>toast.l)toast=null}
    if(!toast&&toastQ.length&&(!banner||banner.t>2.7))toast=toastQ.shift();
    if(G.P.caught){talkBeep-=rdt;if(talkBeep<=0){talkBeep=.13;sfx('talk')}}
    if(hyp(G.P.vx,G.P.vy)>1.5&&!G.P.up&&Math.random()<.1){splash(G.P.x+rand(-.3,.3),G.P.y+rand(-.2,.2),1,waterY);if(Math.random()<.2)sfx('splash')}
    watchFps(rdt);
  }else{inp.duck=false;inp.tap=false;if(!G.S){flow.x+=.05*rdt;flow.y+=.25*rdt}}
  shake=Math.max(0,shake-rdt*3);flash=Math.max(0,flash-rdt*2.5);
  draw3D(rdt);
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  if(G.S&&(G.mode==='play'||G.mode==='dam'||G.mode==='dead')){labels();hud()}
}
function resize(){W=window.innerWidth||800;H=window.innerHeight||600;u=clamp(Math.min(W/11.6,H/12.5),22,66);lw=Math.max(2,u*.06);camera.aspect=W/H;camera.updateProjectionMatrix();applyQ()}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',e=>{audio();if(joy.on)return;joy.on=true;joy.id=e.pointerId;joy.ox=joy.x=e.clientX;joy.oy=joy.y=e.clientY;joy.t=performance.now();joy.moved=false;try{cv.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
cv.addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;joy.x=e.clientX;joy.y=e.clientY;if(hyp(joy.x-joy.ox,joy.y-joy.oy)>8)joy.moved=true});
const up=e=>{if(!joy.on||e.pointerId!==joy.id)return;if(!joy.moved&&performance.now()-joy.t<260)inp.tap=true;joy.on=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('lostpointercapture',up);cv.addEventListener('contextmenu',e=>e.preventDefault());
const dk=$('#duck');dk.addEventListener('pointerdown',e=>{audio();inp.duck=true;inp.tap=true;dk.classList.add('on');e.preventDefault()});for(const k of['pointerup','pointercancel','pointerleave'])dk.addEventListener(k,()=>dk.classList.remove('on'));
window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k===' '||k==='spacebar'){if(!e.repeat){inp.duck=true;inp.tap=true}e.preventDefault();return}
  if(k==='escape'||k==='p'){pause(!paused);return}if(k.startsWith('arrow'))e.preventDefault();keys[k]=true;if(!e.repeat&&G.P&&G.P.caught)inp.tap=true});
window.addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joy.on=false});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause(true)});
window.addEventListener('resize',resize);
$('#pause').addEventListener('click',()=>pause(true));
$('#bPlay').addEventListener('click',()=>{sfx('ui');start(0,false)});$('#bResume').addEventListener('click',()=>pause(false));
$('#bRestart').addEventListener('click',()=>start(G.S.i,true));$('#bRetry').addEventListener('click',()=>start(G.S.i,true));
$('#bQuit').addEventListener('click',()=>{G=newGame();paused=false;setMusic('title');show('title')});$('#bAgain').addEventListener('click',()=>start(0,false));
$('#bGfx').addEventListener('click',()=>{gfx.q=(gfx.q+2)%3;gfx.auto=false;applyQ();save()});
const vm=$('#vMusic'),vs=$('#vSfx');vm.value=Math.round(vol.music*100);vs.value=Math.round(vol.sfx*100);
vm.addEventListener('input',()=>{vol.music=vm.value/100;setVol();save()});vs.addEventListener('input',()=>{vol.sfx=vs.value/100;setVol();save();sfx('boat')});
if(!('ontouchstart' in window))$('#tip').textContent='Drag, or arrow keys, to wade · SPACE ducks under';
resize();setMusic('title');
if(document.fonts&&document.fonts.load){document.fonts.load('700 30px "Fredoka"').catch(()=>{});document.fonts.load('30px "Lilita One"').catch(()=>{})}
requestAnimationFrame(t=>{last=t;frame(t)});
window.__atc={renderer,get G(){return G},start,step,inp,STRETCH,get audio(){return {AC,master,musicBus:duckG,sfxBus}},sfx,gfx,applyQ,pause};
</script>
